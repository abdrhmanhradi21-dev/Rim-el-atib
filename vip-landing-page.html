<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP PRO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; }
        body {
            font-family: 'Cairo', Arial;
            background: linear-gradient(135deg, #0d0d0d 0%, #1a1a1a 50%, #000 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Age Verification Modal */
        .age-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            animation: fadeIn 0.5s;
        }

        .age-modal.hidden {
            display: none;
        }

        .age-content {
            background: linear-gradient(135deg, #1a1a1a, #0d0d0d);
            border: 3px solid #ff0033;
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 0 60px rgba(255,0,51,0.8);
            animation: slideUp 0.5s;
        }

        .age-icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .age-title {
            font-size: 1.8rem;
            color: #ff0033;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255,0,51,0.8);
        }

        .age-text {
            font-size: 1rem;
            color: #ddd;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .age-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .age-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .age-btn.yes {
            background: linear-gradient(135deg, #ff0033, #ff1493);
            color: #fff;
            box-shadow: 0 0 20px rgba(255,0,51,0.6);
        }

        .age-btn.yes:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255,0,51,1);
        }

        .age-btn.no {
            background: rgba(255,255,255,0.1);
            color: #aaa;
            border: 2px solid #aaa;
        }

        .age-btn.no:hover {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }

        .main-content {
            text-align: center;
            max-width: 800px;
            animation: fadeIn 1s ease-out;
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 20px;
            animation: glow 2s infinite;
        }

        .title {
            font-size: 2.5rem;
            color: #ff0033;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(255,0,51,0.8);
        }

        .subtitle {
            font-size: 1.1rem;
            color: #ccc;
            margin-bottom: 30px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .stat {
            text-align: center;
            padding: 20px;
            border: 2px solid #ff0033;
            border-radius: 10px;
            background: rgba(255,0,51,0.1);
            transition: all 0.3s;
        }

        .stat:hover {
            background: rgba(255,0,51,0.2);
            transform: scale(1.05);
        }

        .stat-num {
            font-size: 2rem;
            color: #ff0033;
            font-weight: bold;
        }

        .stat-text {
            font-size: 0.9rem;
            color: #aaa;
        }

        .btn {
            padding: 20px 60px;
            font-size: 1.3rem;
            background: linear-gradient(135deg, #ff0033, #ff1493);
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            margin: 20px 0;
            box-shadow: 0 0 30px rgba(255,0,51,0.6);
            transition: all 0.3s;
        }

        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 50px rgba(255,0,51,1);
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .feature {
            padding: 20px;
            background: rgba(255,0,51,0.05);
            border: 1px solid rgba(255,0,51,0.3);
            border-radius: 10px;
            transition: all 0.3s;
        }

        .feature:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(255,0,51,0.4);
        }

        .feature-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .feature-text {
            font-size: 0.9rem;
            color: #ddd;
        }

        /* Countdown */
        .countdown {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0d0d0d, #000);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 9999;
            gap: 40px;
        }

        .countdown.show { display: flex; }

        .countdown-title {
            font-size: 2.5rem;
            color: #ff0033;
            animation: pulse 1s infinite;
        }

        .countdown-number {
            font-size: 10rem;
            font-weight: bold;
            color: #ff0033;
            animation: countPulse 1s ease-in-out;
        }

        .countdown-text {
            font-size: 1.2rem;
            color: #ccc;
        }

        .progress-bar {
            width: 300px;
            height: 8px;
            background: rgba(255,0,51,0.2);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #ff0033;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, #ff0033, #ff1493);
            width: 100%;
            transition: width 1s linear;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 20px rgba(255,0,51,0.8); }
            50% { text-shadow: 0 0 40px rgba(255,0,51,1); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes countPulse {
            0% { transform: scale(1.3); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: scale(0.8); opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .title { font-size: 1.8rem; }
            .countdown-number { font-size: 6rem; }
            .stats { gap: 20px; flex-direction: column; }
            .age-content { padding: 40px 25px; }
        }
    </style>
</head>
<body>
    <!-- Age Verification Modal -->
    <div class="age-modal" id="ageModal">
        <div class="age-content">
            <div class="age-icon">⚠️</div>
            <div class="age-title">التحقق من العمر</div>
            <div class="age-text">
                هذا الموقع مخصص للأشخاص البالغين فقط.<br>
                يجب أن تكون بعمر 18 سنة أو أكثر للمتابعة.
            </div>
            <div class="age-buttons">
                <button class="age-btn yes" onclick="confirmAge()">نعم، أنا فوق 18</button>
                <button class="age-btn no" onclick="denyAge()">لا، غادر</button>
            </div>
        </div>
    </div>

    <!-- Countdown Screen -->
    <div class="countdown" id="countdown">
        <div class="countdown-title">⏳ جاري التحضير...</div>
        <div class="countdown-number" id="num">5</div>
        <div class="countdown-text">سيتم نقلك للموقع خلال ثواني</div>
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="mainContent" style="display: none;">
        <div class="logo">🎯 VIP PRO 🎯</div>
        <h1 class="title">دخول VIP الآن</h1>
        <p class="subtitle">دخول سريع وآمن للمحتوى الحصري</p>

        <div class="stats">
            <div class="stat">
                <div class="stat-num">8,932</div>
                <div class="stat-text">👥 زائر اليوم</div>
            </div>
            <div class="stat">
                <div class="stat-num">4.9</div>
                <div class="stat-text">⭐ التقييم</div>
            </div>
            <div class="stat">
                <div class="stat-num">100%</div>
                <div class="stat-text">🔒 آمن</div>
            </div>
        </div>

        <button class="btn" onclick="startCountdown()">🔥 دخول VIP الآن 🔥</button>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">⚡</div>
                <div class="feature-text">سرعة عالية</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🔐</div>
                <div class="feature-text">خصوصية تامة</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📱</div>
                <div class="feature-text">متوافق</div>
            </div>
            <div class="feature">
                <div class="feature-icon">⚙️</div>
                <div class="feature-text">وصول فوري</div>
            </div>
        </div>
    </div>

    <script>
        function confirmAge() {
            document.getElementById('ageModal').classList.add('hidden');
            document.getElementById('mainContent').style.display = 'block';
            localStorage.setItem('ageVerified', 'true');
        }

        function denyAge() {
            window.location.href = 'https://www.google.com';
        }

        function startCountdown() {
            const countdown = document.getElementById('countdown');
            countdown.classList.add('show');
            
            let current = 5;
            
            const interval = setInterval(() => {
                current--;
                document.getElementById('num').textContent = current;
                document.getElementById('progress').style.width = ((5 - current) / 5) * 100 + '%';
                
                if (current <= 0) {
                    clearInterval(interval);
                    window.location.href = 'https://gamezone771.blogspot.com/';
                }
            }, 1000);
        }

        window.addEventListener('load', function() {
            const ageVerified = localStorage.getItem('ageVerified');
            if (ageVerified) {
                document.getElementById('ageModal').classList.add('hidden');
                document.getElementById('mainContent').style.display = 'block';
            } else {
                document.getElementById('ageModal').classList.remove('hidden');
                document.getElementById('mainContent').style.display = 'none';
            }
        });
    </script>
</body>
</html>
